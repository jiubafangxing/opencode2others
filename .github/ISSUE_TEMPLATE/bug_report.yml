name: Bug report
description: Report something that is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report! Please **redact API keys**
        before pasting any config or command output.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Affected target(s)
      multiple: true
      options:
        - pi
        - claude-code
        - codex
        - zcode
        - catalog / network
        - packaging / install
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: opencode2others version
      description: Output of `opencode2others --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      description: Paste the relevant (redacted) output.
      render: shell
    validations:
      required: false
